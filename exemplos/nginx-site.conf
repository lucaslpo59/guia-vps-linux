# /etc/nginx/sites-available/meusite
# Depois do certbot, ele acrescenta sozinho o bloco "listen 443 ssl" e o redirecionamento.

server {
    listen 80;
    listen [::]:80;
    server_name exemplo.com.br www.exemplo.com.br;

    root /var/www/meusite;
    index index.html;

    # Esconde a versão do Nginx nas páginas de erro
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 10m;   # tamanho máximo de upload

    location / {
        try_files $uri $uri/ =404;
    }

    # Arquivos com hash no nome podem ficar em cache por muito tempo
    location ~* \.(css|js|png|jpg|jpeg|webp|svg|woff2)$ {
        expires 30d;
        access_log off;
    }

    # API em Node.js rodando só na máquina local
    location /api/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Atualizações ao vivo (Server-Sent Events)
    location /api/eventos {
        proxy_pass http://127.0.0.1:3000/eventos;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Nunca servir arquivos ocultos (.env, .git)
    location ~ /\. {
        deny all;
    }
}
